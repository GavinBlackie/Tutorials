<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 - Forms</title>
</head>
<body>

    <!-- 
    Form Methods:
    GET = send some generic, nonsensitive data
    POST = send some sensitive data


    <label>
        "for" attribute is for screen-readers

    <input>
        types: text, password, tel (phone #s), date, radio,
               checkbox

        NOTE: pattern is used for regex!!!

        Radiobuttons in the same group MUST have the same
        "name" attribute!!!

    enctype="multipart/form-data" means that large amounts of data
    is separated and reassembled

    -->

    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="Username">Username: </label>
        <input type="text" id="Username" minlength="6" maxlength="15" required>

        <label for="Password">Password:</label>
        <input type="password" id="Password"><br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Spongebob@gmail.com"><br>

        <label for="phone">Phone #:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" 
        pattern="\d{3}-\d{3}-\d{4}"><br>

        <label for="bday">Birthdate:</label>
        <input type="date" id="bday"><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99" value="1"><br>

        <label for="title">Title:</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." name="title">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." name="title">
        <label for="Mrs.">Mrs.</label>
        <input type="radio" id="Mrs." name="title">
        <label for="PHD.">PHD.</label>
        <input type="radio" id="PHD." name="title"><br>

        <label for="payment">Payment</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="mastercard">MasterCard</option>
            <option value="giftcard">Giftcard</option>
        </select><br>

        <label for="subscribe">Subscribe:</label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea><br>

        <label for="file">File:</label>
        <input type="file" id="file" accept="image/png"><br>

        <input type="reset"><br>
        <input type="submit">

    </form>


</body>
</html>
