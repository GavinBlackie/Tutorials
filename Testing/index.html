<body>

        alt="Image of a tulip"
        height="200"/>

    <div id="output">Loading...</div>

        fetch('https://lab2-data-[yourlearnerid].s3.amazonaws.com/data.json')

            .catch(err => document.getElementById("output").innerText = "Failed")
    </script>
